<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKII AI - PRO MOD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@600&display=swap');
        
        body { background: #000; color: #00ffcc; font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        .panel { 
            width: 350px; background: linear-gradient(145deg, #0a0a0a, #1a1a1a); 
            border: 1px solid #00ffcc; border-radius: 25px; padding: 25px; 
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2); text-align: center;
        }

        .brand { font-family: 'Audiowide', cursive; font-size: 24px; color: #fff; text-shadow: 0 0 15px #00ffcc; margin-bottom: 20px; }
        
        .live-indicator { font-size: 12px; background: #222; padding: 5px 10px; border-radius: 20px; color: #ff0055; border: 1px solid #ff0055; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .result-val { font-size: 120px; font-weight: 900; color: #fff; margin: 10px 0; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .box { background: #111; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .val { font-size: 18px; color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

<div class="panel">
    <div class="brand">HACKII AI</div>
    <div class="live-indicator">● SYSTEM LIVE</div>
    
    <div id="result" class="result-val">--</div>
    
    <div class="info-grid">
        <div class="box">
            <div style="font-size: 10px;">ACTIVE USERS</div>
            <div id="users" class="val">8,492</div>
        </div>
        <div class="box">
            <div style="font-size: 10px;">SERVER LATENCY</div>
            <div class="val">0.02ms</div>
        </div>
    </div>
</div>

<script>
    let lastNumber = null;

    async function getFastResult() {
        try {
            const response = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json', { cache: "no-store" });
            const data = await response.json();
            const latest = data.data.list[0].number;

            if (latest !== lastNumber) {
                document.getElementById('result').innerText = latest;
                lastNumber = latest;
                // Animation effect on change
                document.getElementById('result').style.transform = "scale(1.1)";
                setTimeout(() => { document.getElementById('result').style.transform = "scale(1)"; }, 200);
            }
        } catch (e) { console.error("API Fetching..."); }
    }

    // High Performance Loop
    function startEngine() {
        let sec = new Date().getSeconds();
        // 54 se 59 aur start ke 2 seconds mein Full Turbo
        if (sec >= 54 || sec <= 2) {
            getFastResult();
            setTimeout(startEngine, 100); // 100ms extremely fast speed
        } else {
            getFastResult();
            setTimeout(startEngine, 2000); // Normal background refresh
        }
    }

    startEngine();
</script>
</body>
</html>
