<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKII AI | LIVE MOD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@700&display=swap');
        body { background: #000; color: #fff; font-family: 'Orbitron', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .card { 
            width: 340px; background: linear-gradient(145deg, #101010, #1a1a1a); 
            border: 3px solid #00ffcc; border-radius: 30px; padding: 25px; 
            text-align: center; box-shadow: 0 0 60px rgba(0, 255, 204, 0.4);
            position: relative;
        }

        .brand { font-size: 30px; font-weight: 900; color: #00ffcc; text-transform: uppercase; text-shadow: 0 0 20px #00ffcc; }
        .issue-text { font-size: 15px; color: #ff00ff; margin-top: 10px; font-weight: bold; }
        .result-val { font-size: 110px; font-weight: 900; margin: 20px 0; color: #fff; text-shadow: 0 0 30px #ff00ff; animation: scale 1s infinite alternate; }
        
        @keyframes scale { from { transform: scale(1); } to { transform: scale(1.05); } }

        .footer-stats { display: flex; justify-content: space-between; border-top: 1px solid #333; padding-top: 15px; margin-top: 10px; }
        .stat-box { font-size: 12px; color: #888; }
        .stat-val { font-size: 16px; color: #00ffcc; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand">HACKII AI</div>
    <div id="issue" class="issue-text">PERIOD: LOADING...</div>
    <div id="result" class="result-val">0</div>
    
    <div class="footer-stats">
        <div class="stat-box">SERVER<br><span class="stat-val">LIVE</span></div>
        <div class="stat-box">LATENCY<br><span class="stat-val">0.01ms</span></div>
    </div>
</div>

<script>
    let lastIssue = "";

    async function fetchUpdate() {
        try {
            // API call
            const res = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json');
            const json = await res.json();
            
            // Data path correction: list[0] ke andar 'issue' aur 'number' dono hote hain
            const data = json.data.list[0];
            const issueNumber = data.issue;
            const resultNumber = data.number;

            if (issueNumber !== lastIssue) {
                document.getElementById('issue').innerText = "PERIOD: " + issueNumber;
                document.getElementById('result').innerText = resultNumber;
                lastIssue = issueNumber;
            }
        } catch(e) { console.log("System Syncing..."); }
    }

    // High Speed Engine
    function loop() {
        let sec = new Date().getSeconds();
        // Fast polling 54s to 02s
        if (sec >= 54 || sec <= 2) {
            fetchUpdate();
            setTimeout(loop, 200); 
        } else {
            fetchUpdate();
            setTimeout(loop, 2000);
        }
    }
    loop();
</script>
</body>
</html>
